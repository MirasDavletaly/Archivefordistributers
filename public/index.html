<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Archive</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2314171a'/><path d='M9 11h14M9 16h14M9 21h9' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Экран входа. Подписи проставляет i18n при загрузке. -->
<div id="gate" class="gate hidden">
  <form class="gate-box" id="gate-form">
    <h1 data-i18n="app.title">Supplier Archive</h1>
    <p data-i18n="gate.prompt">Enter the access password</p>
    <input type="password" id="gate-password" data-i18n-placeholder="gate.password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit" data-i18n="gate.submit">Sign in</button>
    <p id="gate-error" class="form-error hidden" style="margin-top:12px"></p>
    <button type="button" class="btn btn-quiet" id="gate-language" style="width:auto;margin-top:16px"></button>
  </form>
</div>

<!-- Приложение -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1><a href="#/" style="color:inherit" data-i18n="app.title">Supplier Archive</a></h1>
        <span class="counts" id="counts"></span>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="add-supplier" data-i18n="nav.add">+ Add supplier</button>
        <a class="btn" href="#/brands" data-i18n="nav.brands">Brands</a>
        <a class="btn" id="export-link" href="/api/export.csv" data-i18n="nav.export">Export CSV</a>
        <button class="btn" id="language"></button>
        <button class="btn btn-quiet hidden" id="logout" data-i18n="nav.logout">Sign out</button>
      </div>
    </div>
  </div>
  <main id="view"></main>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
